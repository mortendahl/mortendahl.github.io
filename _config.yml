# Site settings
title: Cryptography and Computer Science
header-img: img/home-bg.jpg
copyright_name: Morten Dahl
description: "Applications in machine learning and blockchain"
baseurl: ""
url: "https://mortendahl.github.io"
github: mortendahl

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 50
# Jekyll 3 (used by GitHub Pages) replaces its default exclude list with this one
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - Gruntfile.js
  - less
  - Makefile
  - docker.sh
  - Dockerfile
  - README.md
  - LICENSE-THEME

plugins: [jekyll-paginate, jekyll-feed]

gist:
  noscript: false
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

{% comment %}Loaded only on pages with `math: true` in their front matter{% endcomment %}
<script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']]
        },
        svg: {
            fontCache: 'global'
        }
    };
</script>
<script
    type="text/javascript" id="MathJax-script" async
    src="{{ "/js/mathjax/tex-svg-full.js" | prepend: site.baseurl }}">
</script>
